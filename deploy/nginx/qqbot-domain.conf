# ============================================================
#  公开站 + 管理后台 —— 域名 + 正规证书的公网配置
#
#  和 qqbot-ip.conf 的区别：后台不是 404，默认公开给有账号的人，单管理员可加 IP 白名单。
#  安全边界：
#    · 证书来自腾讯云免费 DV（TrustAsia），覆盖 firefire.online 与 www 前缀
#    · 后台默认公开，靠账号密码 + 登录限流；单管理员可加 allow/deny
#    · 后台登录接口单独限流 5 次/分钟，挡住自动化爆破
#    · 应用内还有「同一来源 + 同一账号失败 5 次锁 10 分钟」
#  ⚠️ 证书 90 天到期：2027-01-26。到期前重新申请并替换 /etc/nginx/certs/ 下的文件
#
#  证书位置：/etc/nginx/certs/qqbot.crt 与 qqbot.key
#    · 自签：openssl 生成，浏览器会警告一次
#    · Let's Encrypt IP 证书：由 deploy hook 把 /etc/letsencrypt/live/<IP>/ 下的
#      文件复制到这两个路径再 reload。**配置本身不用改**，这也是路径固定在这里的原因
# ============================================================

limit_req_zone $binary_remote_addr zone=public_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=public_page:10m rate=120r/m;
# 后台登录：每分钟 5 次，burst 5。一个人正常登录只需要 1 次
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

upstream qqbot {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP 一律跳 HTTPS：否则一次 http:// 访问就会把密码明文发出去
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name firefire.online www.firefire.online;

    # ACME 校验必须走明文 80，而且不能被下面的 301 掉 ——
    # 顺序就是规则：匹配到更长的 location 优先，所以这段要写在 301 前面
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 事件入口只给 NapCat 直连 8080；公网 Nginx 一律不转发
    location ^~ /onebot/ {
        client_max_body_size 1m;
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name firefire.online www.firefire.online;

    ssl_certificate     /etc/nginx/certs/qqbot.crt;
    ssl_certificate_key /etc/nginx/certs/qqbot.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 后台传轮播图要 2MB 上下，和 application.yml 的 16MB 对齐
    client_max_body_size 16m;

    # ============================================================
    #  前端静态资源：由 Nginx 直接读盘，不再经过 Java
    #
    #  为什么：Java 重启时页面就打不开了。直出之后重启只影响接口 ——
    #  用户看到的是「数据暂时取不到」，而不是整站 502。
    #  顺带把 731 KB 的 assets 从 Tomcat 的工作线程上摘下来。
    #
    #  路径与 systemd 的 WorkingDirectory 一致（/opt/qqbot/server），
    #  也就是 release 脚本 rsync 的目标 server/web-dist。
    #  ⚠️ web-dist 不存在时这里会 404 —— 部署顺序必须是「先传 web-dist，再 reload」。
    # ============================================================
    root /opt/qqbot/server/web-dist;
    sendfile on;
    tcp_nopush on;

    # Java 侧没有配 compression，静态直出之后这里必须补上，
    # 否则那个 117 KB 的 chunk 是裸传的
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 文件名里带内容哈希：换内容就是换文件名，可以永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 两个入口 HTML 必须每次回源校验。
    # 缓存住它们就会出现「HTML 是旧的、它引用的 assets 哈希已经删了」—— 白屏。
    location = /public.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /admin.html {
        # 后台入口用 no-store：连"回源校验"都省掉，退出登录后不可能看到上一页
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # robots.txt 在 jar 里（src/main/resources/static），不在 web-dist，仍然交给 Java
    location = /robots.txt {
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
    }

    # /admin 没有斜杠时交给前端路由：Java 那边是 302 到 /admin/，这里对齐
    location = /admin {
        return 302 /admin/;
    }

    location /api/public/carousel/image/ {
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/public/ {
        limit_req zone=public_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ★ 登录接口单独收紧：这是唯一匿名可达的后台入口
    location /admin/api/login {
        # 多人后台：不设 IP 白名单，靠登录限流与账号密码
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ★ 后台接口：转发给 Java（鉴权、审计都在应用里）
    #   比 /admin/ 更长，所以会先命中这里；/admin/api/login 的限流块更长，仍然优先
    location /admin/api/ {
        # 多人后台：不设 IP 白名单。单管理员可加 allow/deny。
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # 应用在回环上被访问，Tomcat 会用 request.scheme 把相对跳转补成绝对地址，
        # 于是 Location 变成 http://…。这里把它改回 https，避免降级一跳
        proxy_redirect http:// https://;
    }

    # ★ 后台前端路由：从磁盘直出。
    #   缓存一律关掉，否则退出的账号还能看到上一页。
    location /admin/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri /admin.html;
    }

    # /admin.html 的直出规则在上面的静态资源块里（no-cache + 磁盘读）

    # 事件入口只给 NapCat 直连 8080；公网 Nginx 一律不转发
    location ^~ /onebot/ {
        client_max_body_size 1m;
        return 404;
    }

    # 根路径单独一条：try_files 对「/」会当成目录命中，然后因为没有 index.html 而 403。
    location = / {
        try_files /public.html =404;
    }

    # 公开站：静态文件直出，其余（/library、/about、/entry/xxx 这类前端路由）
    # 统一交给 public.html。Java 那边的 SpaForwardController 因此只服务本地直接跑 jar 的场景。
    location / {
        limit_req zone=public_page burst=40 nodelay;
        try_files $uri /public.html;
    }
}
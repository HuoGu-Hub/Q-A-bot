# ============================================================
#  示例助手 —— Nginx 站点配置（公网部署）
#
#  部署结构：
#    www.example.com       公开站（群友访问）
#    admin.example.com     管理后台（只给你自己）
#
#  ⚠️ 安全的核心在于：**管理后台走独立域名 + IP 白名单**。
#     密码是最后一道防线，不是第一道。
# ============================================================

# ---------- 限流区（Nginx 层，比应用层更早拦住）----------
limit_req_zone $binary_remote_addr zone=public_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=public_page:10m rate=120r/m;

upstream qqbot {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ============================================================
#  公开站
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;
    # 上 HTTPS 后这一行会由 certbot 自动改写
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 静态资源：带 hash，可以长缓存
    location /assets/ {
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 首页轮播图：同一个 id 的内容永远不变（换图 = 删掉重传，URL 上的 ?v= 会变），
    # 所以给长缓存；也单独走一条**不吃公开 API 限流配额**的通道 ——
    # 首页一次要拉好几张图，挤在一起很容易把 /api/public/ 那份 60r/m 用完。
    location /api/public/carousel/image/ {
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        # ⚠️ 这里写了 add_header 之后，server 段的那些安全头就**不再继承**了，得自己补一遍。
        #    尤其是 nosniff：这条路径发出去的是用户上传的文件。
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # 公开 API：Nginx 先限流，再交给应用
    location /api/public/ {
        limit_req zone=public_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ★ 公开站上【不允许】访问管理接口
    #   即使应用层有鉴权，这里也直接断掉 —— 纵深防御
    location /admin/ {
        return 404;
    }

    location / {
        limit_req zone=public_page burst=40 nodelay;
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
#  管理后台（独立域名 + IP 白名单）
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ★ 第一道防线：只允许你的 IP
    #   改成你自己的固定 IP；如果是动态 IP，用 VPN 或改成随机路径
    allow 203.0.113.42;      # ← 换成你的 IP
    allow 127.0.0.1;
    deny all;

    # 上传轮播图要用的 body 上限。nginx 默认只有 1MB，
    # 而轮播图自己的上限是 app.site.carousel.max-size-kb（默认 2048KB）——
    # 不放开的话 2MB 的图会被 nginx 用 413 挡在门外，页面只会看到"上传失败"。
    # ⚠️ 要和 application.yml 里的 spring.servlet.multipart.max-request-size 对齐（那边 16MB）：
    #    nginx 这一层挡下来的话，返回的是它自己的 **HTML 错误页**，
    #    前端的 JSON 解析会失败，只能说一句"HTTP 413，服务器没给原因"。
    client_max_body_size 16m;

    # 登录接口额外限流 —— 防密码爆破
    location /admin/api/login {
        limit_req zone=public_api burst=5 nodelay;
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后台不缓存
        add_header Cache-Control "no-store" always;
    }
}

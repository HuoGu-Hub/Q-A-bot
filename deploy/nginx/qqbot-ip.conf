# ============================================================
#  公开站 —— 只有 IP、没有域名时的临时配置
#
#  用途：备案还没下来，先用 http://服务器IP/ 把公开站开出去。
#        有域名并且备案通过后，换成 qqbot.conf，这份就可以删掉。
#
#  为什么能用 IP 直连：备案管的是「域名解析到内地服务器」，直接访问 IP 不受限制。
#
#  管理后台不在这份配置里：这里对 /admin/ 一律 404，
#  后台请走 SSH 隧道访问 http://127.0.0.1:8080/admin/
# ============================================================

limit_req_zone $binary_remote_addr zone=public_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=public_page:10m rate=120r/m;

upstream qqbot {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端产物带 hash，可以长缓存
    location /assets/ {
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # server 段写了 add_header 之后子级不再继承，安全头要自己补
        add_header X-Content-Type-Options nosniff always;
    }

    # 首页轮播图：单独给长缓存，且不吃公开 API 的限流配额
    location /api/public/carousel/image/ {
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/public/ {
        limit_req zone=public_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公网入口上一律不暴露后台
    location /admin/ {
        return 404;
    }

    location / {
        limit_req zone=public_page burst=40 nodelay;
        proxy_pass http://qqbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

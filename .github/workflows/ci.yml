name: CI

# 什么时候跑：
#   · 往 main 推代码 —— 保护主干
#   · 任何 PR —— 合并前先看结果
on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推两次时，取消前一次没跑完的 —— 省额度，也避免旧结果盖新结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 后端
  server:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # pom 在 server/ 下，缓存键要指到这里，否则每次都重下依赖
          cache-dependency-path: server/pom.xml

      # 1113 个测试，本地约 1 分 44 秒。
      # RetrievalGoldenTest 需要生产语料，CI 里没有库时它会自己跳过（Assumptions），不算失败。
      - name: mvn test
        working-directory: server
        run: mvn -B test

  # ---------------------------------------------------------------- API 契约
  api-contract:
    name: API 契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml

      # 用真实控制器生成规范，保证 docs/openapi.json 与代码一致
      - name: 生成 OpenAPI
        working-directory: server
        run: mvn -B -Dtest=OpenApiSpecTest test

      - name: 检查规范是否已提交
        run: git diff --exit-code docs/openapi.json

      - name: 装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Redocly lint
        run: npx --yes @redocly/cli@2.72.1 lint docs/openapi.json

      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint docs/openapi.json

      # 与基线比较；破坏性变更必须显式更新 docs/openapi.baseline.json。
      # openapi-diff 的 CLI 对 breaking 变更仍返回 0，所以这里读输出再决定是否失败。
      - name: OpenAPI diff
        shell: bash
        run: |
          set -o pipefail
          npx --yes openapi-diff@0.24.1 docs/openapi.baseline.json docs/openapi.json | tee /tmp/openapi-diff.log
          if grep -q "Breaking changes found" /tmp/openapi-diff.log; then
            echo "::error::OpenAPI breaking changes detected"
            exit 1
          fi

  # ---------------------------------------------------------------- 依赖与密钥
  security:
    name: 依赖与密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      # 只扫生产依赖；registry 自身故障不阻断，但发现漏洞会失败
      - name: pnpm audit
        working-directory: web
        run: pnpm audit --prod --audit-level high --ignore-registry-errors

      - name: Secret scan
        run: bash scripts/secret-scan.sh

  # ---------------------------------------------------------------- 前端
  web:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 必须用 pnpm 11：pnpm-workspace.yaml 里的 allowBuilds 是 11 的写法，
      #    换低版本会读不到，esbuild 的原生二进制装不上，vite build 直接失败。
      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      # build 脚本本身就是 vue-tsc --noEmit && vite build，
      # 所以这一步同时兜住类型错误和打包错误
      - name: 类型检查 + 构建
        working-directory: web
        run: pnpm run build